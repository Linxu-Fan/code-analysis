name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import codescope; print(codescope.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build executables (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean packaging/codescope.spec
      - name: Smoke test the frozen build
        shell: bash
        run: |
          set -e
          ./dist/CodeScope/codescope-cli.exe --version
          ./dist/CodeScope/codescope-cli.exe create smoke.csdb -r tests/samples -a
          ./dist/CodeScope/codescope-cli.exe check smoke.csdb
          ./dist/CodeScope/codescope-cli.exe info smoke.csdb geo::Rect::area
          ./dist/CodeScope/codescope-cli.exe graph smoke.csdb main -t control -o cfg.svg
          ./dist/CodeScope/codescope-cli.exe report smoke.csdb -o smoke_report -q
          test -f smoke_report/index.html
      - name: Smoke test the AI assistant (frozen CLI against a mock server)
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import subprocess, sys
          from tests.ai_mock import MockLLM
          script = [{"tool_calls": [("describe", {"name": "geo::Rect"})]}, {"content": "Rect is a Shape."}]
          with MockLLM(script) as llm:
              out = subprocess.run(["dist/CodeScope/codescope-cli.exe", "ask", "smoke.csdb", "What is Rect?",
                                    "--url", llm.url], capture_output=True, text=True, timeout=120)
              print(out.stdout, out.stderr)
              assert out.returncode == 0 and "Rect is a Shape." in out.stdout, "ask failed"
          PY
      - name: Check llama.cpp release downloads (GitHub API over HTTPS from the frozen CLI)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          python -c "from tests.test_ai_setup import write_gguf; write_gguf('tiny.gguf', {'general.architecture': 'qwen3moe', 'qwen3moe.block_count': 40, 'qwen3moe.expert_count': 128}, pad=4096)"
          for b in cuda vulkan cpu; do ./dist/CodeScope/codescope-cli.exe ai-setup tiny.gguf --backend $b --dry-run; done
      - name: Smoke test the GUI executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CodeScope\CodeScope.exe -ArgumentList "smoke.csdb" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "CodeScope.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\CodeScope -DestinationPath "dist\CodeScope-${{ steps.ver.outputs.version }}-portable.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist\CodeScope" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: CodeScope-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/CodeScope-*-Setup.exe
            dist/CodeScope-*-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodeScope-*-Setup.exe
            dist/CodeScope-*-portable.zip

  one-click-build:
    # Exercises build.bat exactly as a user would run it (minus the final key press).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run build.bat
        shell: cmd
        run: build.bat -NoPause
      - name: Check outputs
        shell: pwsh
        run: |
          $v = python -c "import codescope; print(codescope.__version__)"
          foreach ($f in @("dist\CodeScope\CodeScope.exe", "dist\CodeScope\codescope-cli.exe",
                           "dist\CodeScope-$v-portable.zip", "dist\CodeScope-$v-Setup.exe")) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            Write-Host "ok $f"
          }
          if (Test-Path "build\codescope\CodeScope.exe") { throw "intermediate exe left in build\" }
