name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import codescope; print(codescope.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build executables (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean packaging/codescope.spec
      - name: Smoke test the frozen build
        shell: bash
        run: |
          set -e
          ./dist/CodeScope/codescope-cli.exe --version
          ./dist/CodeScope/codescope-cli.exe create smoke.csdb -r tests/samples -a
          ./dist/CodeScope/codescope-cli.exe check smoke.csdb
          ./dist/CodeScope/codescope-cli.exe info smoke.csdb geo::Rect::area
          ./dist/CodeScope/codescope-cli.exe graph smoke.csdb main -t control -o cfg.svg
          ./dist/CodeScope/codescope-cli.exe report smoke.csdb -o smoke_report -q
          test -f smoke_report/index.html
      - name: Smoke test the GUI executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CodeScope\CodeScope.exe -ArgumentList "smoke.csdb" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "CodeScope.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\CodeScope -DestinationPath "dist\CodeScope-${{ steps.ver.outputs.version }}-portable.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist\CodeScope" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: CodeScope-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/CodeScope-*-Setup.exe
            dist/CodeScope-*-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodeScope-*-Setup.exe
            dist/CodeScope-*-portable.zip
